<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daytrail · Focus mode</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="scene">
    <div class="sun" aria-hidden="true"></div>
    <div class="cloud cloud-one" aria-hidden="true"></div>
    <div class="cloud cloud-two" aria-hidden="true"></div>
    <div class="hill hill-back" aria-hidden="true"></div>
    <div class="hill hill-front" aria-hidden="true"></div>
    <section class="focus-card" aria-labelledby="focus-title">
      <p class="eyebrow">Daytrail · focus mode</p>
      <h1 id="focus-title">This path is paused.</h1>
      <p class="lead">You asked Daytrail to keep distractions out of the way for this focus session.</p>
      <div class="trail-box" id="trail-box" hidden>
        <p class="label">Your current Trail</p>
        <h2 id="trail-name"></h2>
        <p id="trail-checkpoint" hidden></p>
      </div>
      <p class="timer" id="focus-timer" aria-live="polite"></p>
      <p class="status" id="focus-status" role="status"></p>
      <div class="actions">
        <button class="button primary" id="return-task" type="button">Return to my Trail</button>
        <button class="button" id="end-focus" type="button">End focus</button>
      </div>
    </section>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
